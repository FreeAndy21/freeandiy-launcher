# FreeANDIY rebrand rules for the launcher (applied by freeandiy/tools/rebrand, after the patches
# in freeandiy/patches/). Modified-by: FreeANDIY (Free Andy Agency), 2026.
#
# The launcher knows every app by its id (`photocraft`), display name (`PhotoCraft`), GitHub repo
# (`storytold/photocraft`) and bundle id (`ai.storyteller.photocraft`). The rules below turn each
# into FreeANDIY's (`freeandiy-photo`, `FreeANDIY Photo`, `FreeAndy21/freeandiy-photo`,
# `agency.freeandy.photo`) everywhere: code, tests, catalogs and packaging alike, so upstream's
# tests keep describing the same behaviour. The patches drop CADCraft and FigCraft (not FreeANDIY
# apps), upstream's release feed, the screenshots and the community links.
#
# Protected text: rules first swap text that must keep the upstream name (crate names, upstream's
# copyright) for @@...@@ markers, and the last rules swap them back.

templates = []

delete = [
  "docs/brand",                                  # ArtCraft marks: forks must remove them
  "docs/screenshots",                            # show the ArtCraft logo and upstream's apps
  "assets/app-icon",                             # upstream's identity; ours is copied in below
  "assets/app-icons",                            # upstream's app icons; ours are copied in (overlay)
  "assets/social",                               # links to ArtCraft's social accounts
  "packaging/icons.sh",                          # icons come from the FreeANDIY meta repository
  "packaging/macos/dmg",                         # background and layout carry the ArtCraft mark; ours is copied in
  "flake.nix",                                   # upstream's Nix packaging (names and hashes are upstream's)
  "flake.lock",
  ".github/workflows/release.yml",               # upstream's release and platform jobs (ArtCraft's shared actions); ours: freeandiy*.yml
  ".github/workflows/windows-arm64.yml",
  ".github/workflows/packaging-lint.yml",
  ".github/workflows/freebsd.yml",
]

# Catalogs: the Discord entries go (the links are gone from the UI).
[[drop_lines]]
include = ["crates/ui-egui/src/i18n/*.tsv"]
regex = '^[^#\n]*Discord'
min = 1

# ---------------------------------------------------------------------------------------------
# Protect text that keeps the upstream name.

[[replace]]
name = "protect: upstream's copyright holder and contributors"
include = ["**/*.rs", "crates/ui-egui/src/i18n/*.tsv", "packaging/**", "apps/artcraft-launcher-web/index.html", ".github/**", "xtask/**"]
regex = 'ArtCraft Team and the ArtCraft Launcher (contributors|authors)'
replace = '@@AC@@ Team and the @@UP@@ ${1}'
min = 0

[[replace]]
name = "protect: crate names artcraft-launcher-<crate>"
include = ["**/*.rs", "crates/ui-egui/src/i18n/*.tsv", "packaging/**", "apps/artcraft-launcher-web/index.html", ".github/**", "xtask/**"]
regex = 'artcraft-launcher-(core|native|ui-egui)\b'
replace = '@@PKG@@-${1}'
min = 1

[[replace]]
name = "protect: the web crate and binary (xtask, CI, trunk's data-bin)"
include = ["xtask/**", ".github/**", "apps/artcraft-launcher-web/index.html"]
find = "artcraft-launcher-web"
replace = "@@PKG@@-web"
min = 3

[[replace]]
name = "protect: crate idents artcraft_launcher"
include = ["**/*.rs", "crates/ui-egui/src/i18n/*.tsv", "packaging/**", "apps/artcraft-launcher-web/index.html", ".github/**", "xtask/**"]
find = "artcraft_launcher"
replace = "@@PKGU@@"
min = 10

[[replace]]
name = "protect: cargo -p / --package / source paths of the app packages"
include = ["**/*.rs", "crates/ui-egui/src/i18n/*.tsv", "packaging/**", "apps/artcraft-launcher-web/index.html", ".github/**", "xtask/**"]
regex = '(-p |--package |apps/|apps\\)artcraft-launcher(-web)?\b'
replace = '${1}@@PKG@@${2}'
min = 1

[[replace]]
name = "web release zip: freeandiy-launcher-web-<version>.zip (the web crate and binary keep upstream's name)"
include = ["packaging/web/package.sh", "crates/native/src/self_update.rs"]
find = "artcraft-launcher-web"
replace = "{{this.repo}}-web"
min = 0

[[replace]]
name = "package maintainer"
include = ["packaging/**"]
find = "ArtCraft Launcher maintainers <craft-launcher@storyteller.ai>"
replace = "{{brand.maintainer}}"
min = 1

