# ---------------------------------------------------------------------------------------------
# Odds and ends.

[[replace]]
name = "AppStream developer id"
include = ["packaging/**"]
find = '<developer id="ai.storyteller">'
replace = '<developer id="{{brand.id_prefix}}">'
min = 1

[[replace]]
name = "desktop and AppStream search keywords"
include = ["packaging/**"]
regex = '(Keywords=|<keyword>)artcraft\b'
replace = '${1}freeandiy'
min = 2

[[replace]]
name = "installer art: the FreeANDIY apps only (CADCraft and FigCraft are not FreeANDIY's)"
include = ["packaging/windows/package.ps1"]
regex = ", '(cadcraft|figcraft)'"
replace = ""
min = 2

[[replace]]
name = "installer art: the FreeANDIY wordmark"
include = ["packaging/windows/package.ps1"]
find = "'docs\\brand\\artcraft-logo-white.png'"
replace = "'assets\\brand\\freeandiy-wordmark-paper.png'"
min = 1

[[replace]]
name = "installer art: brand terms"
include = ["packaging/windows/package.ps1"]
find = "(docs/brand/LICENSE-brand.txt)"
replace = "(freeandiy/assets/brand/LICENSE-brand.txt)"
min = 1

[[replace]]
name = "installer art: paper-and-ink colours with the stamp rose"
include = ["packaging/windows/package.ps1"]
regex = "FromHtml\\('#(121316|2d81ff)'\\)"
replace = "FromHtml('#@@C${1}@@')"
min = 2

[[replace]]
name = "installer art: ink"
